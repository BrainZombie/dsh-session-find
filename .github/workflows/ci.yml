name: ci

# The self test runs against fixtures, so it needs nothing but Node: no DSH
# install, no session history. `dsh-plugin verify .` does need a real Host and is
# documented in README (Develop).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Self test
        run: npm test
